[workspace]
members = ["crates/gitless-sync"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["KneShell"]
license = "MIT"
repository = "https://github.com/KneShell/gitless-sync"
rust-version = "1.95.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[profile.release]
panic = "abort"
lto = "thin"
strip = true
