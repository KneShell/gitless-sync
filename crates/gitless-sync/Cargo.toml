[package]
name = "gitless-sync"
version = "0.1.0"
description = "Read-only AI-friendly CLI for diffing a local directory against a GitHub repo without git"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
walkdir = "2"
ignore = "0.4"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
toml = "0.8"
base64 = "0.22"
rayon = "1"
similar = "3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "gitless-sync"
path = "src/main.rs"
