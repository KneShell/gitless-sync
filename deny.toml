[graph]
all-features = false
no-default-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "Zlib",
    # webpki-roots ships Mozilla's CA bundle (data, not code) under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
